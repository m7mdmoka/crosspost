<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrossPost login</title><style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#222}</style></head><body><p id="msg">Returning to CrossPost...</p><script>var q=new URLSearchParams(location.search);var p=(q.get("state")||"").split(".")[0];if(["youtube","tiktok","instagram"].indexOf(p)>-1){location.replace("http://localhost:5050/auth/"+p+"/callback"+location.search);}else{document.getElementById("msg").textContent="This page finishes a CrossPost login. Start the login from the CrossPost app on your computer.";}</script></body></html>
